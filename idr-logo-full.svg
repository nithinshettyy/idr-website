<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="faceTopW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E55A00"/>
    </linearGradient>
    <linearGradient id="faceLeftW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2C2C2C"/>
    </linearGradient>
    <linearGradient id="faceRightW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>

  <!-- Cube icon (same geometry) -->
  <polygon points="40,8 68,24 40,40 12,24" fill="url(#faceTopW)"/>
  <polygon points="12,24 40,40 40,72 12,56" fill="url(#faceLeftW)"/>
  <polygon points="68,24 40,40 40,72 68,56" fill="url(#faceRightW)"/>
  <polyline points="40,8 68,24 68,56 40,72 12,56 12,24 40,8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <line x1="40" y1="8" x2="40" y2="72" stroke="rgba(255,255,255,0.1)" stroke-width="0.6"/>
  <polygon points="58,16 68,24 58,24" fill="#FF8C33" opacity="0.7"/>

  <!-- Divider -->
  <line x1="88" y1="16" x2="88" y2="64" stroke="#E0E0E0" stroke-width="1"/>

  <!-- "IDR" monogram -->
  <text x="100" y="52" font-family="'Georgia', serif" font-size="36" font-weight="700" fill="#111111" letter-spacing="3">IDR</text>

  <!-- "Institute of Digital Risk" tagline -->
  <text x="100" y="67" font-family="'Arial', 'Helvetica', sans-serif" font-size="10.5" fill="#555555" letter-spacing="2.2" font-weight="400">INSTITUTE OF DIGITAL RISK</text>
</svg>
